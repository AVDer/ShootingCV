<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="styles.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Target Practice</title>
  <script type="module" src="/main.js" defer></script>
</head>

<body>
  <!-- Main target area -->
  <div class="main">
    <div class="target-container">
      <canvas id="targetCanvas" width="1000" height="1000"></canvas>
      <canvas id="hitsCanvas" width="1000" height="1000"></canvas>
    </div>
  </div>

  <!-- Sidebar controls -->
  <div class="sidebar">
    <h3>Controls</h3>
    <input id="serverAddrInput" type="text" minlength="7" maxlength="15" size="15"
      pattern="^(?>(\d|[1-9]\d{2}|1\d\d|2[0-4]\d|25[0-5])\.){3}(?1)$">
    <button id="connectBtn">Connect</button>
    <button id="addHitBtn">Add Random Hit</button>
  </div>


</body>

</html>
