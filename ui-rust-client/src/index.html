<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="styles.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Target Practice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script type="module" src="/main.js" defer></script>
</head>

<body>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab-btn active" data-tab="practice">Target Practice</button>
    <button class="tab-btn" data-tab="calibration">Calibration</button>
  </div>

  <!-- TAB: Target Practice -->
  <div class="tab-content active" id="practice">
    <div class="main">
      <div class="target-container">
        <canvas id="targetCanvas" width="1000" height="1000"></canvas>
        <canvas id="hitsCanvas" width="1000" height="1000"></canvas>
      </div>
    </div>

    <div class="sidebar">
      <h3>Controls</h3>
      <input id="serverAddrInput" type="text" minlength="7" maxlength="15" size="15"
        pattern="^((25[0-5]|2[0-4]\\d|1\\d{2}|[1-9]?\\d)\\.){3}(25[0-5]|2[0-4]\\d|1\\d{2}|[1-9]?\\d)$">
      <button id="connectBtn">Connect</button>
      <button id="addHitBtn">Single hit</button>
      <hr>
      <button id="startBtn">Start</button>
      <button id="stopBtn">Stop</button>
    </div>
  </div>

  <!-- TAB: Calibration -->
  <div class="tab-content" id="calibration">
    <div class="calibration-container">

      <!-- Image selector -->
      <div class="image-selector">
        <label>
          <input type="radio" name="imageView" value="original" checked>
          Original
        </label>
        <label>
          <input type="radio" name="imageView" value="transformed">
          Transformed
        </label>
        <label>
          <input type="radio" name="imageView" value="marked">
          Marked
        </label>
      </div>

      <!-- Image preview -->
      <div class="image-preview">
        <img id="calibrationImage" alt="Calibration" />
      </div>

      <!-- Controls -->
      <div class="calibration-controls">
        <input type="file" id="imageInput" accept="image/*" hidden>
        <button id="readImageBtn">Read image</button>
        <button id="calibrateBtn">Calibrate</button>
      </div>

    </div>
  </div>

</body>

</html>
